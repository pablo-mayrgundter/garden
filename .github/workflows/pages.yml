name: Deploy to GitHub Pages

# Builds main and publishes it to the root of the gh-pages branch, served at
# https://<owner>.github.io/<repo>/. clean-exclude keeps the PR previews
# (pr-preview/, managed by pr-preview.yml) alive across main deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build
        with:
          base-path: /${{ github.event.repository.name }}/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview
